# ===== Etapa 9 - ClinicaVeterinaria-Web =====
spring.application.name=ClinicaVeterinaria-Web
server.port=8080
server.servlet.session.timeout=30m

# Banco MySQL (mesmo servidor das Etapas 6/7, mas banco novo: clinicaveterinaria_web).
# Usuário/senha podem vir de variáveis de ambiente DB_USUARIO e DB_SENHA (não versionar senha!).
spring.datasource.url=jdbc:mysql://localhost:3306/clinicaveterinaria_web?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}

# JPA/Hibernate cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cookie de sessão: não acessível por JavaScript e não enviado em requisições de outros sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
