<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de consultas — Sistema Clínica Veterinária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kodchasan:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-pagina="registro">
  <main class="tela">
    <header class="topo">Sistema Clínica Veterinária<small>Carolina Sabino de Araujo</small></header>
    <h1 class="titulo">Registro de consultas</h1>
    <div id="aviso" class="aviso" role="status"></div>
    <form id="form-consulta">
      <div class="campo"><label for="cpf">CPF do tutor</label>
        <div class="linha"><input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" data-mascara="cpf" data-validar="obrigatorio cpf"><button class="mini" type="button" id="btn-buscar">Buscar</button></div>
        <div class="erro" role="alert"></div></div>
      <div class="campo"><label for="animal">Animal / consulta</label>
        <select id="animal" name="animal" data-validar="selecao"><option value="">Selecione</option></select><div class="erro" role="alert"></div></div>
      <div class="campo"><label for="diagnostico">Diagnóstico</label>
        <textarea id="diagnostico" name="diagnostico" data-validar="obrigatorio"></textarea><div class="erro" role="alert"></div></div>
      <div class="campo"><label for="tratamento">Tratamento</label><textarea id="tratamento" name="tratamento"></textarea></div>
      <div class="campo"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes"></textarea></div>
      <div class="acoes"><button class="botao salvar" type="submit">Salvar</button><a class="botao cancelar" href="index.html">Cancelar</a></div>
    </form>
  </main>
  <script src="assets/js/validacoes.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
