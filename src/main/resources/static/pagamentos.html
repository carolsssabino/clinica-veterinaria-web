<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de pagamentos — Sistema Clínica Veterinária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kodchasan:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body data-pagina="pagamentos">
  <main class="tela">
    <header class="topo">Sistema Clínica Veterinária<small>Carolina Sabino de Araujo</small></header>
    <h1 class="titulo">Controle de pagamentos</h1>
    <div id="aviso" class="aviso" role="status"></div>
    <form id="form-pagamento">
      <div class="campo"><label for="cpf">CPF do tutor</label>
        <div class="linha"><input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" data-mascara="cpf" data-validar="obrigatorio cpf"><button class="mini" type="button" id="btn-buscar">Buscar</button></div>
        <div class="erro" role="alert"></div></div>
      <div class="campo"><label for="animal">Animal</label>
        <select id="animal" name="animal" data-validar="selecao"><option value="">Selecione</option></select><div class="erro" role="alert"></div></div>
      <div class="campo"><label for="consulta">Consulta</label>
        <select id="consulta" name="consulta" data-validar="selecao"><option value="">Selecione</option></select><div class="erro" role="alert"></div></div>
      <div class="campo"><label for="valor">Valor (R$)</label>
        <input id="valor" name="valor" type="text" inputmode="decimal" placeholder="0,00" data-validar="obrigatorio valor"><div class="erro" role="alert"></div></div>
      <div class="campo"><label for="status">Status</label>
        <select id="status" name="status" data-validar="selecao"><option value="">Selecione</option><option value="PAGO">Pago</option><option value="PENDENTE">Pendente</option></select><div class="erro" role="alert"></div></div>
      <div class="campo"><label>Forma de pagamento</label>
        <div class="formas" role="radiogroup">
          <label><input type="radio" name="forma" value="CREDITO">Cartão</label>
          <label><input type="radio" name="forma" value="DEBITO">Débito</label>
          <label><input type="radio" name="forma" value="DINHEIRO">Dinheiro</label>
          <label><input type="radio" name="forma" value="PIX">Pix</label>
        </div><div class="erro" id="erro-forma" role="alert"></div></div>
      <div class="campo"><label for="valorPago">Valor pago:</label>
        <input id="valorPago" name="valorPago" type="text" inputmode="decimal" placeholder="0,00" data-validar="valor-pago"><div class="erro" role="alert"></div></div>
      <div class="acoes"><button class="botao salvar" type="submit">Salvar</button><a class="botao cancelar" href="index.html">Cancelar</a></div>
    </form>
  </main>
  <script src="assets/js/validacoes.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
